[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-kv"
version = "0.1.0"
description = "Generative latent KV planning research prototype"
requires-python = ">=3.10"
dependencies = [
  "torch",
  "transformers",
  "datasets",
  "numpy",
  "pandas",
  "matplotlib",
  "pyyaml",
]

[project.scripts]
latent-kv = "latent_kv.cli:main"

[tool.setuptools.packages.find]
include = ["latent_kv*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
